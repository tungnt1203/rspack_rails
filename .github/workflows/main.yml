name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '3.2'
          - '3.3'
          - '3.4'

    steps:
      - uses: actions/checkout@v5
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task
        run: bundle exec rake

  integration:
    runs-on: ubuntu-latest
    name: Rails ${{ matrix.rails }} app
    strategy:
      fail-fast: false
      matrix:
        rails:
          - '~> 7.2.0'
          - '~> 8.1.0'

    steps:
      - uses: actions/checkout@v5
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Generate a Rails app and run every installer, build and precompile
        run: bin/integration "${{ matrix.rails }}"

  typescript:
    runs-on: ubuntu-latest
    name: TypeScript entry + Slim layout (Rails ${{ matrix.rails }})
    strategy:
      fail-fast: false
      matrix:
        rails: ['~> 7.2.0', '~> 8.1.0']

    steps:
      - uses: actions/checkout@v5
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Generate an app with application.ts and a Slim layout, run every installer, build and precompile
        run: bin/integration-typescript "${{ matrix.rails }}"

  migrate:
    runs-on: ubuntu-latest
    name: Migrate ${{ matrix.from }} (Rails ${{ matrix.rails }})
    strategy:
      fail-fast: false
      matrix:
        from: [importmap, jsbundling, tailwind, sass]
        rails: ['~> 7.2.0', '~> 8.1.0']

    steps:
      - uses: actions/checkout@v5
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Generate an app, run rspack:migrate, build and precompile
        run: bin/integration-migrate ${{ matrix.from }} "${{ matrix.rails }}"
