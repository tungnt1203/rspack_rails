name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '3.2'
          - '3.3'
          - '3.4'

    steps:
      - uses: actions/checkout@v5
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task
        run: bundle exec rake

  integration:
    runs-on: ubuntu-latest
    name: Rails ${{ matrix.rails }} app${{ matrix.rspack && format(' (Rspack {0})', matrix.rspack) || '' }}
    strategy:
      fail-fast: false
      matrix:
        rails:
          - '~> 7.2.0'
          - '~> 8.1.0'
        rspack: ['']
        include:
          # The oldest Rspack the installers' ^2 range allows; the other jobs get the latest 2.x.
          - rails: '~> 8.1.0'
            rspack: '2.0'

    steps:
      - uses: actions/checkout@v5
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Generate a Rails app and run every installer, build and precompile
        run: bin/integration "${{ matrix.rails }}"
        env:
          RSPACK_VERSION: ${{ matrix.rspack }}

  # Yarn 1 and bun, on one Rails version: the other jobs cover npm.
  package_managers:
    runs-on: ubuntu-latest
    name: ${{ matrix.manager }} (Rails 8.1)
    strategy:
      fail-fast: false
      matrix:
        manager: [yarn, bun]

    steps:
      - uses: actions/checkout@v5
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Set up bun
        if: matrix.manager == 'bun'
        uses: oven-sh/setup-bun@v2
      - name: Generate a Rails app and run every installer, build and precompile
        run: bin/integration "~> 8.1.0"
        env:
          PACKAGE_MANAGER: ${{ matrix.manager }}

  hmr:
    runs-on: ubuntu-latest
    name: HMR in a browser (Rails ${{ matrix.rails }})
    strategy:
      fail-fast: false
      matrix:
        rails: ['~> 7.2.0', '~> 8.1.0']

    steps:
      - uses: actions/checkout@v5
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Edit a controller, add one, edit CSS and a view under rspack serve; Chromium checks nothing reloads
        run: bin/integration-hmr "${{ matrix.rails }}"

  template:
    runs-on: ubuntu-latest
    name: rails new -m template.rb (${{ matrix.mode }}, Rails ${{ matrix.rails }})
    strategy:
      fail-fast: false
      matrix:
        mode: [skip-js, no-pipeline, importmap]
        rails: ['~> 7.2.0', '~> 8.1.0']

    steps:
      - uses: actions/checkout@v5
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Generate an app from template.rb, typecheck, doctor and precompile
        run: bin/integration-template ${{ matrix.mode }} "${{ matrix.rails }}"

  docker:
    runs-on: ubuntu-latest
    name: Docker image of a new app (Rails ${{ matrix.rails }})
    strategy:
      fail-fast: false
      matrix:
        rails: ['~> 8.1.0']

    steps:
      - uses: actions/checkout@v5
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: rails new --devcontainer -m template.rb, docker build (assets:precompile runs rspack) and run
        run: bin/integration-docker "${{ matrix.rails }}"

  typescript:
    runs-on: ubuntu-latest
    name: TypeScript entry + Slim layout (Rails ${{ matrix.rails }})
    strategy:
      fail-fast: false
      matrix:
        rails: ['~> 7.2.0', '~> 8.1.0']

    steps:
      - uses: actions/checkout@v5
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Generate an app with application.ts and a Slim layout, run every installer, build and precompile
        run: bin/integration-typescript "${{ matrix.rails }}"

  migrate:
    runs-on: ubuntu-latest
    name: Migrate ${{ matrix.from }} (Rails ${{ matrix.rails }})
    strategy:
      fail-fast: false
      matrix:
        from: [importmap, jsbundling, tailwind, sass]
        rails: ['~> 7.2.0', '~> 8.1.0']

    steps:
      - uses: actions/checkout@v5
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Generate an app, run rspack:migrate, build and precompile
        run: bin/integration-migrate ${{ matrix.from }} "${{ matrix.rails }}"
