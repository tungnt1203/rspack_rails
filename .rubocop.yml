AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Metrics/BlockLength:
  Exclude:
    - spec/**/*
    - lib/tasks/**/*.rake

Style/Documentation:
  Exclude:
    - lib/rspack_rails/railtie.rb

Metrics/ClassLength:
  Exclude:
    - lib/rspack_rails/doctor.rb
